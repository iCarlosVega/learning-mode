[project]
name = "learning-mode"
version = "0.1.0"
description = "Local-first, explicitly activated learning support for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-repeat>=0.9,<1"]

[project.scripts]
learn = "learning_mode.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
